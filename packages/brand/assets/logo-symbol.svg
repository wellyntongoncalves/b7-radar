<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="B7 Radar">
  <title>B7 Radar</title>
  <defs>
    <linearGradient id="b7grad" x1="10" y1="10" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2457FF"/>
      <stop offset="0.55" stop-color="#6D35FF"/>
      <stop offset="1" stop-color="#19C9E8"/>
    </linearGradient>
  </defs>
  <!-- Seven blocks forming the number 7: a crossbar of four blocks and a
       three-block descending stroke. Represents the seven pillars of B7. -->
  <g fill="url(#b7grad)">
    <rect x="13" y="13" width="9" height="9" rx="2.5"/>
    <rect x="24" y="13" width="9" height="9" rx="2.5"/>
    <rect x="35" y="13" width="9" height="9" rx="2.5"/>
    <rect x="46" y="13" width="9" height="9" rx="2.5"/>
    <rect x="35" y="24" width="9" height="9" rx="2.5"/>
    <rect x="27" y="35" width="9" height="9" rx="2.5"/>
    <rect x="19" y="46" width="9" height="9" rx="2.5"/>
  </g>
</svg>
